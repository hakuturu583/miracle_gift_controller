<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ミラギフ棒コントローラー</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>ミラギフ棒コントローラー</h1>
  <p class="sub">Rust + WebAssembly でサンプル単位に事前合成した信号を再生します</p>
</header>

<main>
  <section class="panel" id="status-panel">
    <div id="status">ボタンを押すと再生します（初回はオーディオを有効化します）</div>
    <div id="now" aria-live="polite"></div>
  </section>

  <section class="panel">
    <h2>消灯</h2>
    <div class="grid" data-group="off"></div>
    <h2>点灯</h2>
    <div class="grid" data-group="on"></div>
    <h2>点滅 (遅)</h2>
    <div class="grid" data-group="blink50"></div>
    <h2>点滅 (速)</h2>
    <div class="grid" data-group="blink60"></div>
    <h2>ミラクルギフトパレード</h2>
    <div class="grid" data-group="mgp"></div>
  </section>

  <section class="panel">
    <h2>コード直接入力</h2>
    <form id="custom">
      <input id="code" inputmode="numeric" maxlength="7" placeholder="例: 3234321" autocomplete="off">
      <button type="submit">再生</button>
      <button type="button" id="dl">WAV保存</button>
      <span id="code-msg"></span>
    </form>
  </section>

  <section class="panel">
    <h2>設定</h2>
    <div class="settings">
      <label>音量 <input type="range" id="amp" min="0.05" max="0.9" step="0.05" value="0.5"> <output id="amp-o"></output></label>
      <label>送信回数 <input type="number" id="repeat" min="1" max="5" value="2"></label>
      <label>先頭の無音 (秒) <input type="number" id="lead" min="0" max="1" step="0.05" value="0.15"></label>
      <label>パケット間隔 (秒) <input type="number" id="gap" min="0.05" max="2" step="0.05" value="0.3"></label>
      <label>フェード (ms) <input type="number" id="ramp" min="1" max="30" step="1" value="6"></label>
      <label class="chk"><input type="checkbox" id="keepalive" checked> 出力デバイスを起こしたままにする（先頭欠け防止）</label>
    </div>
  </section>

  <section class="panel">
    <h2>マイクで受信テスト</h2>
    <p class="note">スピーカーから出た信号をマイクで拾ってデコードします。音量や距離の調整に使えます（エコーキャンセル等は無効化して録音）。</p>
    <button id="mic">受信テスト開始</button>
    <ol id="miclog" reversed></ol>
  </section>

  <section class="panel">
    <details>
      <summary>全128コード</summary>
      <div class="grid small" data-group="all"></div>
    </details>
  </section>
</main>

<footer>
  プロトコルとコード表は <a href="https://github.com/ohtake/miracle-light-controller">ohtake/miracle-light-controller</a> (ISC) を参考にしています。
</footer>
<script>
  // Surface errors on the page itself: phones have no visible console.
  (function () {
    function show(msg) {
      var el = document.getElementById('status');
      if (el) { el.textContent = 'エラー: ' + msg; el.style.color = '#e55'; }
    }
    window.addEventListener('error', function (e) { show((e.message || e.error) + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '')); });
    window.addEventListener('unhandledrejection', function (e) { var r = e.reason; show(r && (r.stack || r.message) || String(r)); });
    window.__miragiftBoot = setTimeout(function () { show('app.js が読み込まれていません (' + navigator.userAgent + ')'); }, 8000);
  })();
</script>
<script type="module" src="app.js"></script>
</body>
</html>
